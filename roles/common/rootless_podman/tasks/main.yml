---
- name: Enable and start the rootless Podman socket
  ansible.builtin.command:
    argv:
      - runuser
      - --user
      - "{{ runner.user }}"
      - --
      - env
      - "XDG_RUNTIME_DIR=/run/user/{{ runner_uid }}"
      - "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/{{ runner_uid }}/bus"
      - systemctl
      - --user
      - enable
      - --now
      - podman.socket
  args:
    chdir: "/home/{{ runner.user }}"
  register: podman_socket_enable
  changed_when: "'Created symlink' in podman_socket_enable.stderr"

- name: Verify rootless Podman information
  ansible.builtin.command:
    argv:
      - runuser
      - --user
      - "{{ runner.user }}"
      - --
      - env
      - "XDG_RUNTIME_DIR=/run/user/{{ runner_uid }}"
      - podman
      - info
      - --format
      - json
  args:
    chdir: "/home/{{ runner.user }}"
  register: podman_info
  changed_when: false

- name: Assert Podman is rootless
  ansible.builtin.assert:
    that:
      - (podman_info.stdout | from_json).host.security.rootless | bool
    fail_msg: Podman must run rootless for the dedicated runner user.

- name: Run the rootless Podman smoke test
  ansible.builtin.command:
    argv:
      - runuser
      - --user
      - "{{ runner.user }}"
      - --
      - env
      - "XDG_RUNTIME_DIR=/run/user/{{ runner_uid }}"
      - podman
      - run
      - --rm
      - --pull=missing
      - "{{ common_podman_smoke_image }}"
      - echo
      - ok
  args:
    chdir: "/home/{{ runner.user }}"
  register: podman_smoke
  changed_when: false

- name: Require successful rootless smoke output
  ansible.builtin.assert:
    that:
      - podman_smoke.stdout_lines | last == "ok"
