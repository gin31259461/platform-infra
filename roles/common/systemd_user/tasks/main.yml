---
- name: Check systemd lingering state
  ansible.builtin.stat:
    path: "/var/lib/systemd/linger/{{ runner.user }}"
  register: linger_file

- name: Enable systemd lingering for the runner user
  ansible.builtin.command:
    argv:
      - loginctl
      - enable-linger
      - "{{ runner.user }}"
  when: not linger_file.stat.exists
  changed_when: true

- name: Start the runner user manager
  ansible.builtin.systemd_service:
    name: "user@{{ runner_uid }}.service"
    state: started
