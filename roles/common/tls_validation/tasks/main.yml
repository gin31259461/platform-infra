---
- name: Validate private CA source
  ansible.builtin.stat:
    path: "{{ tls.private_ca_source }}"
  register: private_ca_source
  when: tls.private_ca_enabled | bool

- name: Require the configured private CA certificate
  ansible.builtin.assert:
    that:
      - tls.private_ca_source | length > 0
      - private_ca_source.stat.exists
      - private_ca_source.stat.isreg
      - not tls.private_ca_source.endswith('.key')
      - not tls.private_ca_source.endswith('.pem.key')
    fail_msg: A readable public CA certificate is required; private keys are not accepted.
  when: tls.private_ca_enabled | bool

- name: Install the private CA certificate for GitLab Runner
  ansible.builtin.copy:
    src: "{{ tls.private_ca_source }}"
    dest: "/home/{{ runner.user }}/gitlab-runner/config/certs/ca.crt"
    remote_src: true
    owner: "{{ runner.user }}"
    group: "{{ runner.user }}"
    mode: "{{ common_runner_ca_mode }}"
  when: tls.private_ca_enabled | bool
  notify: Restart runner manager

- name: Remove an obsolete managed CA certificate
  ansible.builtin.file:
    path: "/home/{{ runner.user }}/gitlab-runner/config/certs/ca.crt"
    state: absent
  when: not tls.private_ca_enabled | bool
  notify: Restart runner manager
