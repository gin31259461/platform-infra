---
- name: Verify the configured VPN interface exists
  ansible.builtin.command:
    argv:
      - ip
      - link
      - show
      - "{{ network.vpn_interface }}"
  changed_when: false

- name: Verify the GitLab hostname resolves
  ansible.builtin.command:
    argv:
      - getent
      - hosts
      - "{{ gitlab.hostname }}"
  changed_when: false

- name: Select explicit VPN DNS arguments for container checks
  ansible.builtin.set_fact:
    network_validation_dns_args: >-
      {{
        ['--dns', network.vpn_dns]
        if network.vpn_dns | length > 0
        else []
      }}

- name: Verify host-level GitLab HTTPS health
  ansible.builtin.command:
    argv:
      - curl
      - --fail
      - --show-error
      - --silent
      - --location
      - --connect-timeout
      - "{{ common_network_connect_timeout_seconds | string }}"
      - --max-time
      - "{{ common_network_max_time_seconds | string }}"
      - "{{ gitlab.health_url }}"
  changed_when: false
  when: not tls.private_ca_enabled | bool

- name: Verify host-level private-CA GitLab HTTPS health
  ansible.builtin.command:
    argv:
      - curl
      - --fail
      - --show-error
      - --silent
      - --location
      - --cacert
      - "{{ tls.private_ca_source }}"
      - --connect-timeout
      - "{{ common_network_connect_timeout_seconds | string }}"
      - --max-time
      - "{{ common_network_max_time_seconds | string }}"
      - "{{ gitlab.health_url }}"
  changed_when: false
  when: tls.private_ca_enabled | bool

- name: Verify container-level public-CA GitLab HTTPS health over host VPN routing
  ansible.builtin.command:
    argv: >-
      {{
        [
          'runuser', '--user', runner.user, '--',
          'env', 'XDG_RUNTIME_DIR=/run/user/' ~ runner_uid,
          'podman', 'run', '--rm', '--network', 'host', '--pull=missing'
        ]
        + network_validation_dns_args
        + [
          common_network_validation_image,
          '--fail', '--show-error', '--silent', '--location',
          '--connect-timeout', common_network_connect_timeout_seconds | string,
          '--max-time', common_network_max_time_seconds | string,
          gitlab.health_url
        ]
      }}
  args:
    chdir: "/home/{{ runner.user }}"
  changed_when: false
  when: not tls.private_ca_enabled | bool

- name: Verify container-level private-CA GitLab HTTPS health over host VPN routing
  ansible.builtin.command:
    argv: >-
      {{
        [
          'runuser', '--user', runner.user, '--',
          'env', 'XDG_RUNTIME_DIR=/run/user/' ~ runner_uid,
          'podman', 'run', '--rm', '--network', 'host', '--pull=missing'
        ]
        + network_validation_dns_args
        + [
          '--volume', tls.private_ca_source ~ ':/tmp/gitlab-ca.crt:ro',
          common_network_validation_image,
          '--fail', '--show-error', '--silent', '--location',
          '--cacert', '/tmp/gitlab-ca.crt',
          '--connect-timeout', common_network_connect_timeout_seconds | string,
          '--max-time', common_network_max_time_seconds | string,
          gitlab.health_url
        ]
      }}
  args:
    chdir: "/home/{{ runner.user }}"
  changed_when: false
  when: tls.private_ca_enabled | bool
