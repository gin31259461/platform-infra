---
- name: Read Runner manager service state
  become: true
  become_user: "{{ runner_account_user }}"
  environment: "{{ runner_systemd_environment }}"
  ansible.builtin.command:
    argv:
      - systemctl
      - --user
      - is-active
      - "{{ runner.service_name }}.service"
  register: runner_status_service
  changed_when: false
  failed_when: runner_status_service.rc not in [0, 3]

- name: Read Runner manager container state
  become: true
  become_user: "{{ runner_account_user }}"
  environment: "{{ runner_systemd_environment }}"
  ansible.builtin.command:
    argv:
      - podman
      - ps
      - --all
      - --filter
      - "name=^{{ runner.service_name }}$"
      - --format
      - "{{ '{{.Names}} {{.Status}}' }}"
  register: runner_status_container
  changed_when: false

- name: Inspect persisted Runner configuration
  ansible.builtin.stat:
    path: "{{ runner_config_file }}"
  register: runner_status_config_file

- name: Read persisted Runner configuration
  ansible.builtin.slurp:
    src: "{{ runner_config_file }}"
  register: runner_status_config
  when: runner_status_config_file.stat.exists
  no_log: true

- name: Derive registration status without exposing token output
  ansible.builtin.set_fact:
    runner_status_registered: >-
      {{
        (
          runner_status_config.content | b64decode |
          regex_findall('(?m)^\s*\[\[runners\]\]\s*$') | length
        )
        > 0
        if runner_status_config_file.stat.exists
        else false
      }}
  no_log: true

- name: Display Runner status
  ansible.builtin.debug:
    msg:
      host: "{{ inventory_hostname }}"
      service: "{{ runner_status_service.stdout | trim }}"
      container: "{{ runner_status_container.stdout | trim | default('absent', true) }}"
      registered: "{{ runner_status_registered | bool }}"
