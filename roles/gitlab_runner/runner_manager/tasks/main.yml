---
- name: Create the base Runner configuration without registration data
  ansible.builtin.template:
    src: config.base.toml.j2
    dest: "/home/{{ runner.user }}/gitlab-runner/config/config.toml"
    owner: "{{ runner.user }}"
    group: "{{ runner.user }}"
    mode: "{{ gitlab_runner_config_file_mode }}"
    force: false

- name: Enforce private permissions on Runner configuration
  ansible.builtin.file:
    path: "/home/{{ runner.user }}/gitlab-runner/config/config.toml"
    state: file
    owner: "{{ runner.user }}"
    group: "{{ runner.user }}"
    mode: "{{ gitlab_runner_config_file_mode }}"

- name: Install the Runner manager Quadlet
  ansible.builtin.template:
    src: runner.container.j2
    dest: "/home/{{ runner.user }}/.config/containers/systemd/{{ runner.service_name }}.container"
    owner: "{{ runner.user }}"
    group: "{{ runner.user }}"
    mode: "{{ gitlab_runner_quadlet_mode }}"
  notify:
    - Reload runner user systemd for manager
    - Restart runner manager after configuration change

- name: Apply Runner manager handlers before enabling the service
  ansible.builtin.meta: flush_handlers

- name: Check whether the Runner manager is active
  ansible.builtin.command:
    argv:
      - runuser
      - --user
      - "{{ runner.user }}"
      - --
      - env
      - "XDG_RUNTIME_DIR=/run/user/{{ runner_uid }}"
      - "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/{{ runner_uid }}/bus"
      - systemctl
      - --user
      - is-active
      - "{{ runner.service_name }}.service"
  args:
    chdir: "/home/{{ runner.user }}"
  register: runner_manager_active
  changed_when: false
  failed_when: false

- name: Start the generated Runner manager service
  ansible.builtin.command:
    argv:
      - runuser
      - --user
      - "{{ runner.user }}"
      - --
      - env
      - "XDG_RUNTIME_DIR=/run/user/{{ runner_uid }}"
      - "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/{{ runner_uid }}/bus"
      - systemctl
      - --user
      - start
      - "{{ runner.service_name }}.service"
  args:
    chdir: "/home/{{ runner.user }}"
  when: runner_manager_active.stdout != "active"
  changed_when: true
