---
- name: Create the dedicated runner user
  ansible.builtin.user:
    name: "{{ runner.user }}"
    comment: "{{ stack.description }}"
    shell: /bin/bash
    create_home: true
    home: "/home/{{ runner.user }}"
    state: present

- name: Protect the runner home
  ansible.builtin.file:
    path: "/home/{{ runner.user }}"
    state: directory
    owner: "{{ runner.user }}"
    group: "{{ runner.user }}"
    mode: "{{ gitlab_runner_home_mode }}"

- name: Get the runner user record
  ansible.builtin.getent:
    database: passwd
    key: "{{ runner.user }}"

- name: Store the actual runner UID
  ansible.builtin.set_fact:
    runner_uid: "{{ ansible_facts.getent_passwd[runner.user][1] | int }}"

- name: Ensure subordinate ID files exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: touch
    owner: root
    group: root
    mode: "0644"
    modification_time: preserve
    access_time: preserve
  loop:
    - /etc/subuid
    - /etc/subgid

- name: Select non-overlapping subordinate ID ranges
  ansible.builtin.shell: |
    set -o pipefail
    awk -F: -v user="{{ runner.user }}" -v minimum="{{ gitlab_runner_subid_minimum }}" '
      $1 == user { print $2; found=1; exit }
      NF >= 3 && ($2 + $3) > next_id { next_id=$2 + $3 }
      END {
        if (!found) {
          if (next_id < minimum) next_id=minimum
          print next_id
        }
      }
    ' "{{ item }}"
  args:
    executable: /bin/bash
  loop:
    - /etc/subuid
    - /etc/subgid
  register: subordinate_starts
  changed_when: false

- name: Configure subordinate UID range
  ansible.builtin.lineinfile:
    path: /etc/subuid
    regexp: "^{{ runner.user | regex_escape }}:"
    line: "{{ runner.user }}:{{ subordinate_starts.results[0].stdout }}:{{ gitlab_runner_subid_range_size }}"
    owner: root
    group: root
    mode: "0644"

- name: Configure subordinate GID range
  ansible.builtin.lineinfile:
    path: /etc/subgid
    regexp: "^{{ runner.user | regex_escape }}:"
    line: "{{ runner.user }}:{{ subordinate_starts.results[1].stdout }}:{{ gitlab_runner_subid_range_size }}"
    owner: root
    group: root
    mode: "0644"

- name: Create runner configuration directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ runner.user }}"
    group: "{{ runner.user }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "/home/{{ runner.user }}/.config/containers/systemd"
      mode: "0700"
    - path: "/home/{{ runner.user }}/gitlab-runner/config"
      mode: "{{ gitlab_runner_config_mode }}"
    - path: "/home/{{ runner.user }}/gitlab-runner/config/certs"
      mode: "0700"
