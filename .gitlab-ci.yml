---
stages:
  - lint
  - validate
  - test

default:
  image: docker.io/library/python:3.13.5-bookworm
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends shellcheck ripgrep
    - pip install --no-cache-dir ansible-core==2.18.6 ansible-lint==25.6.1 yamllint==1.37.1
    - ansible-galaxy collection install -r requirements.yml

lint:
  stage: lint
  script:
    - ./tests/lint.sh

validate_frontend_runner:
  stage: validate
  rules:
    - changes:
        - roles/common/**/*
        - roles/gitlab_runner/**/*
        - playbooks/gitlab-runner.yml
        - scripts/**/*
        - tests/**/*
        - stacks/gitlab-runners/frontend/**/*
        - requirements.yml
        - ansible.cfg
  script:
    - ./tests/validate-stack.sh gitlab-runners/frontend

validate_dotnet_runner:
  stage: validate
  rules:
    - changes:
        - roles/common/**/*
        - roles/gitlab_runner/**/*
        - playbooks/gitlab-runner.yml
        - scripts/**/*
        - tests/**/*
        - stacks/gitlab-runners/dotnet/**/*
        - requirements.yml
        - ansible.cfg
  script:
    - ./tests/validate-stack.sh gitlab-runners/dotnet

validate_all:
  stage: test
  rules:
    - changes:
        - roles/common/**/*
        - roles/gitlab_runner/**/*
        - playbooks/**/*
        - scripts/**/*
        - tests/**/*
        - requirements.yml
        - ansible.cfg
  script:
    - ./tests/validate-all.sh

validate_web:
  stage: test
  image: docker.io/library/node:22.17.0-bookworm
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile
  rules:
    - changes:
        - apps/web/**/*
        - packages/**/*
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - tsconfig.base.json
        - .nvmrc
        - .gitlab-ci.yml
  script:
    - pnpm validate:web

validate_agent:
  stage: test
  before_script: []
  rules:
    - changes:
        - agent/**/*
        - packages/contracts/**/*
        - Makefile
        - .gitlab-ci.yml
  script:
    - make test-agent
