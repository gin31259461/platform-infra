---
stages:
  - lint
  - validate
  - test

variables:
  UV_VERSION: "0.12.0"
  PYTHON_VERSION: "3.14"
  BASE_LAYER: trixie-slim
  UV_LINK_MODE: copy

default:
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends shellcheck ripgrep
    - uv sync --locked
    - . .venv/bin/activate
    - ansible-galaxy collection install -r requirements.yml

lint:
  stage: lint
  script:
    - ./tests/lint.sh

validate_frontend_runner:
  stage: validate
  rules:
    - changes:
        - roles/common/**/*
        - roles/gitlab_runner/**/*
        - playbooks/gitlab-runner.yml
        - scripts/**/*
        - tests/**/*
        - stacks/gitlab-runners/frontend/**/*
        - requirements.yml
        - ansible.cfg
        - pyproject.toml
        - uv.lock
        - .python-version
        - .gitlab-ci.yml
  script:
    - ./tests/validate-stack.sh gitlab-runners/frontend

validate_dotnet_runner:
  stage: validate
  rules:
    - changes:
        - roles/common/**/*
        - roles/gitlab_runner/**/*
        - playbooks/gitlab-runner.yml
        - scripts/**/*
        - tests/**/*
        - stacks/gitlab-runners/dotnet/**/*
        - requirements.yml
        - ansible.cfg
        - pyproject.toml
        - uv.lock
        - .python-version
        - .gitlab-ci.yml
  script:
    - ./tests/validate-stack.sh gitlab-runners/dotnet

validate_all:
  stage: test
  rules:
    - changes:
        - roles/common/**/*
        - roles/gitlab_runner/**/*
        - playbooks/**/*
        - scripts/**/*
        - tests/**/*
        - requirements.yml
        - ansible.cfg
        - pyproject.toml
        - uv.lock
        - .python-version
        - .gitlab-ci.yml
  script:
    - ./tests/validate-all.sh

validate_web:
  stage: test
  image: docker.io/library/node:22.17.0-bookworm
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile
  rules:
    - changes:
        - apps/web/**/*
        - packages/**/*
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - tsconfig.base.json
        - .nvmrc
        - .gitlab-ci.yml
  script:
    - pnpm validate:web

validate_agent:
  stage: test
  before_script: []
  rules:
    - changes:
        - agent/**/*
        - packages/contracts/**/*
        - Makefile
        - pyproject.toml
        - uv.lock
        - .python-version
        - .gitlab-ci.yml
  script:
    - uv run --locked python -m unittest discover -s agent/tests -v
