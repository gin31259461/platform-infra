---
stages:
  - quality
  - validate

variables:
  UV_VERSION: "0.12.1"
  UV_CACHE_DIR: .uv-cache
  UV_LINK_MODE: copy

.default_python:
  image: docker.io/library/python:3.13.5-bookworm
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache/
  before_script:
    - test -s uv.lock
    - python -m pip install --no-cache-dir "uv==${UV_VERSION}"
    - uv lock --check
    - uv sync --locked --all-groups
    - uv run --locked platform-infra setup
  after_script:
    - uv cache prune --ci

quality:
  extends: .default_python
  stage: quality
  script:
    - uv run --locked ruff format --check .
    - uv run --locked ruff check .
    - uv run --locked mypy --strict src tests bootstrap.py
    - uv run --locked pytest --cov --cov-report=term-missing
    - uv run --locked yamllint .
    - uv run --locked ansible-lint

validate_stacks:
  extends: .default_python
  stage: validate
  script:
    - uv run --locked platform-infra validate-all
