---
stages:
  - verify

default:
  tags:
    - dotnet
    - podman

variables:
  DOTNET_SDK_VERSION: 10.0.302-noble
  DOTNET_RUNTIME_VERSION: 10.0.7-noble
  SQL_SERVER_VERSION: 2022-CU25-GDR2-ubuntu-22.04
  ACCEPT_EULA: "Y"
  MSSQL_PID: Developer
  MSSQL_SA_PASSWORD: "$MSSQL_SA_PASSWORD_UI"

dotnet-and-sql-smoke:
  stage: verify
  image: "mcr.microsoft.com/dotnet/sdk:${DOTNET_SDK_VERSION}"
  services:
    - name: "mcr.microsoft.com/mssql/server:${SQL_SERVER_VERSION}"
      alias: mssql
  script:
    - dotnet --info
    - dotnet new xunit --name RunnerSmoke --output /tmp/RunnerSmoke --no-restore
    - dotnet restore /tmp/RunnerSmoke/RunnerSmoke.csproj --source https://api.nuget.org/v3/index.json
    - dotnet test /tmp/RunnerSmoke/RunnerSmoke.csproj --no-restore
    - |
      for attempt in $(seq 1 60); do
        if (echo >/dev/tcp/mssql/1433) 2>/dev/null; then
          exit 0
        fi
        if [ "${attempt}" -eq 60 ]; then
          echo "SQL Server did not become ready." >&2
          exit 1
        fi
        sleep 2
      done

runtime-smoke:
  stage: verify
  image: "mcr.microsoft.com/dotnet/aspnet:${DOTNET_RUNTIME_VERSION}"
  script:
    - dotnet --info
