---
stages:
  - verify
  - build
  - publish
  - release

default:
  tags:
    - frontend
    - podman

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: "$CI_COMMIT_TAG"
    - if: "$CI_COMMIT_BRANCH"

variables:
  PACKAGE_NAME: art-frontend
  PNPM_STORE_DIR: .pnpm-store
  PNPM_VERSION: 11.17.0

.pnpm-job:
  image: docker.io/library/node:22.22.0-bookworm
  before_script:
    - corepack enable
    - corepack prepare "pnpm@${PNPM_VERSION}" --activate
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/".insteadOf "https://${CI_SERVER_HOST}/"
    - pnpm config set store-dir "${PNPM_STORE_DIR}"
    - pnpm install --frozen-lockfile --prefer-offline
  cache:
    key:
      prefix: "pnpm-${PNPM_VERSION}"
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
    policy: pull-push

quality:
  extends: .pnpm-job
  stage: verify
  script:
    - pnpm check

browser_tests:
  extends: .pnpm-job
  stage: verify
  image: mcr.microsoft.com/playwright:v1.62.0-noble
  variables:
    CI: "true"
    PLAYWRIGHT_HTML_OPEN: never
  script:
    - pnpm exec playwright test --workers=1 --reporter=line,html
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - playwright-report/
      - test-results/

build_production:
  extends: .pnpm-job
  stage: build
  script:
    - pnpm build
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        RELEASE_VERSION="${CI_COMMIT_TAG}"
      else
        RELEASE_VERSION="${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
      fi

      RELEASE_ARCHIVE="${PACKAGE_NAME}-${RELEASE_VERSION}.tar.gz"
      mkdir -p release
      tar -czf "release/${RELEASE_ARCHIVE}" -C dist .
      cd release
      sha256sum "${RELEASE_ARCHIVE}" > "${RELEASE_ARCHIVE}.sha256"
  artifacts:
    name: "${CI_PROJECT_NAME}-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
    expose_as: production build
    expire_in: 30 days
    paths:
      - release/

publish_release_package:
  stage: publish
  image:
    name: docker.io/curlimages/curl:8.12.1
    entrypoint: [""]
  needs:
    - job: build_production
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$/'
  script:
    - |
      RELEASE_ARCHIVE="${PACKAGE_NAME}-${CI_COMMIT_TAG}.tar.gz"
      PACKAGE_BASE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${CI_COMMIT_TAG}"

      curl --fail-with-body --location \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "release/${RELEASE_ARCHIVE}" \
        "${PACKAGE_BASE_URL}/${RELEASE_ARCHIVE}"

      curl --fail-with-body --location \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "release/${RELEASE_ARCHIVE}.sha256" \
        "${PACKAGE_BASE_URL}/${RELEASE_ARCHIVE}.sha256"

create_release:
  stage: release
  image:
    name: docker.io/curlimages/curl:8.12.1
    entrypoint: [""]
  needs:
    - publish_release_package
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$/'
  script:
    - |
      RELEASE_ARCHIVE="${PACKAGE_NAME}-${CI_COMMIT_TAG}.tar.gz"
      PACKAGE_BASE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${CI_COMMIT_TAG}"

      RELEASE_PAYLOAD=$(cat <<EOF
      {
        "name": "Release ${CI_COMMIT_TAG}",
        "tag_name": "${CI_COMMIT_TAG}",
        "description": "Automated production build for ${CI_COMMIT_TAG} (${CI_COMMIT_SHA}).",
        "assets": {
          "links": [
            {
              "name": "${RELEASE_ARCHIVE}",
              "url": "${PACKAGE_BASE_URL}/${RELEASE_ARCHIVE}",
              "direct_asset_path": "/${PACKAGE_NAME}.tar.gz",
              "link_type": "package"
            },
            {
              "name": "${RELEASE_ARCHIVE}.sha256",
              "url": "${PACKAGE_BASE_URL}/${RELEASE_ARCHIVE}.sha256",
              "direct_asset_path": "/${PACKAGE_NAME}.tar.gz.sha256",
              "link_type": "other"
            }
          ]
        }
      }
      EOF
      )

      curl --fail-with-body --request POST \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "${RELEASE_PAYLOAD}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
