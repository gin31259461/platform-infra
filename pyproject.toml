[project]
name = "gitlab-runner-platform-tools"
version = "0.1.0"
description = "Python tooling for gitlab-runner-platform"
requires-python = ">=3.14,<3.15"
dependencies = [
  "jinja2>=3.1.6,<4",
  "pyyaml>=6.0.3,<7",
]

[dependency-groups]
dev = [
  "ansible-lint>=26.6,<27",
  "yamllint>=1.38,<2",
]

[tool.uv]
package = false
