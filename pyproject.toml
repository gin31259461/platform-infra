[project]
name = "platform-infra"
version = "1.0.0"
description = "Python and Ansible automation for rootless Podman GitLab Runner hosts"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "ansible-core==2.18.6",
  "jinja2==3.1.6",
  "pyyaml==6.0.3",
]

[project.scripts]
platform-infra = "platform_infra.cli:main"
platform-infra-quality = "platform_infra.quality:main"

[dependency-groups]
dev = [
  "ansible-lint==25.6.1",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.15.21",
  "types-PyYAML==6.0.12.20250516",
  "yamllint==1.37.1",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13"]
build-backend = "uv_build"

[tool.coverage.run]
branch = true
source = ["platform_infra"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "bootstrap.py"]
warn_unreachable = true
pretty = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests", "."]

[tool.ruff.per-file-target-version]
"bootstrap.py" = "py39"

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "ARG",
  "B",
  "BLE",
  "C4",
  "DTZ",
  "E",
  "F",
  "I",
  "LOG",
  "N",
  "PERF",
  "PIE",
  "PTH",
  "RET",
  "RUF",
  "SIM",
  "UP",
  "W",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.uv]
required-version = ">=0.12.1,<0.13"
