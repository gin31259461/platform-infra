---
- name: Converge GitLab Runner hosts
  hosts: runner_hosts
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  roles:
    - role: preflight
    - role: network_precheck
    - role: packages
    - role: kernel_network
    - role: runner_user
    - role: systemd_user
    - role: rootless_podman
    - role: tls
    - role: runner_manager
    - role: runner_validation
